# Project information
site_name: Machine Learning — EGEI
site_author: Sebastian Azocar
site_description: Machine Learning with AI coding assistants — EGEI
site_url: https://hizocar.github.io/machine_learning_egei/

# Markdown extensions
markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist
  - pymdownx.tabbed

# Theme
theme:
  name: material
  language: en
  logo: images/usm_shield.png
  favicon: images/usm_favicon.png
  features:
    - navigation.instant
    - navigation.top
    - navigation.tabs
    - content.code.annotate
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

# Extra CSS / JS
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js
  - javascripts/charts.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hizocar

plugins:
  - mkdocs-jupyter:
      execute: false
      include_source: true
  - search

nav:
  - Home: index.md
  - Program: program.md
  - Code Assistants: code-assistants.md
  - Classes:
      - classes/classes.md
      - "Class 1 · Types of Data": notebooks/class1.ipynb
      - "Class 2 · Data Manipulation": notebooks/class2.ipynb
      - "Class 3 · What is Machine Learning?": notebooks/class3.ipynb
      - "Class 4 · Classification": notebooks/class4.ipynb
      - "Class 5 · Trees & Random Forests": notebooks/class5.ipynb
  - Projects: projects.md
  - Archive: archive.md
