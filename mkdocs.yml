# Project information
site_name: Machine Learning — EGEI
site_author: Sebastian Azocar
site_description: Machine Learning with AI coding assistants — EGEI
site_url: https://hizocar.github.io/machine_learning_egei/

# Markdown extensions
markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist
  - pymdownx.tabbed

# Theme
theme:
  name: material
  language: en
  logo: images/usm_shield.png
  favicon: images/usm_favicon.png
  features:
    - navigation.instant
    - navigation.top
    - navigation.footer
    - navigation.tabs
    - content.code.annotate
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

# Extra CSS / JS
extra_css:
  - stylesheets/extra.css
  - stylesheets/ml-widgets.css
  - stylesheets/ml-widgets-s06.css
  - stylesheets/ml-widgets-s07.css
  - stylesheets/ml-widgets-s08.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/motion@11.11.13/dist/motion.js
  - javascripts/ml-widgets.js
  - javascripts/ml-widgets-s06.js
  - javascripts/ml-widgets-s07.js
  - javascripts/ml-widgets-s08.js
  - javascripts/course-now.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hizocar

plugins:
  - mkdocs-jupyter:
      execute: false
      include_source: true
  - search

# Notebooks are reached from their session page, not from the menu.
not_in_nav: |
  /notebooks/
  /homeworks/
  /archive.md

nav:
  - Home: index.md
  - Classes:
      - "All sessions": classes/classes.md
      - "S1 · 11 Sep · Data and Decision Making": classes/class1.md
      - "S2 · 25 Sep · Data Manipulation": classes/class2.md
      - "S3 · 2 & 9 Oct · What Is ML?": classes/class3.md
      - "S4 · 23 Oct · The ML Pipeline": classes/class4.md
      - "S5 · 30 Oct · Classification": classes/class5.md
      - "S6 · 6 Nov · Trees and Ensembles": classes/class6.md
      - "S7 · 13 Nov · Selection and Shrinkage": classes/class7.md
      - "S8 · 20 Nov · Unlabeled Data": classes/class8.md
      - "S9 · 27 Nov · Final Presentations": classes/class9.md
  - Project: projects.md
  - The Case: case.md
  - Program: program.md
  - Glossary: glossary.md
  - Code Assistants: code-assistants.md
